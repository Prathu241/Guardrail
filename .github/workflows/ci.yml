name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check guardrail tests
      - name: Unit, workflow and API tests
        run: python -m pytest -q
      - name: Red-team regression gate (fails on any unexpected miss or false positive)
        run: python -m guardrail redteam
      - name: Chaos run (fails if any injected hallucination executes)
        run: python -m guardrail chaos --rounds 3

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t guardrail .
      - name: Smoke test the container
        run: |
          docker run -d --name g -p 8000:8000 guardrail
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/conversations -H 'content-type: application/json' \
            -d '{"customer_id":"C-1001","message":"My order O-5001 arrived with a cracked lantern. Can I get a refund for the lantern?"}' \
            | python3 -c "import sys, json; c = json.load(sys.stdin); assert c['status'] == 'active', c; print('ok')"
