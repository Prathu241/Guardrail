name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check guardrail tests
      - name: Unit, workflow, concurrency, side-effect and API tests
        run: python -m pytest -q
      - name: Security regression gate (all four configurations vs the committed baseline)
        run: |
          python -m guardrail redteam --ablation --out redteam/results/latest.json \
            --report redteam/results/latest.md --check redteam/results/baseline.json
          python -m guardrail redteam
      - name: Chaos run (fails if any injected hallucination executes)
        run: python -m guardrail chaos --rounds 3 | tee redteam/results/latest.chaos.json
      - name: Keep the results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: redteam/results/latest.*

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t guardrail:test .
      - name: Smoke test the container
        run: IMAGE=guardrail:test scripts/docker_smoke.sh
      - name: Production compose file is valid
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config --quiet
      - name: Production mode refuses an unsafe configuration
        run: |
          if docker run --rm -e GUARDRAIL_ENV=production guardrail:test; then
            echo "production mode started without API keys"; exit 1
          fi
