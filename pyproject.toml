[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail"
version = "0.1.0"
description = "Pre-execution guardrails that verify agent tool calls against a reference knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
claude = ["anthropic>=1.13"]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-anthropic>=1.0"]
dev = ["pytest>=8", "ruff", "anthropic>=1.13", "langgraph>=1.0", "langchain-core>=1.0", "langchain-anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["guardrail*"]

[tool.setuptools.package-data]
guardrail = ["data/kb/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
