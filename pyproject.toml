[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail"
version = "0.3.0"
description = "Pre-execution guardrails that verify agent tool calls against a system of record"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "anthropic>=1.13",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
guardrail = "guardrail.cli:main"

[tool.setuptools.packages.find]
include = ["guardrail*"]

[tool.setuptools.package-data]
guardrail = ["data/kb/*.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
markers = ["live: calls the real Anthropic API (skipped unless ANTHROPIC_API_KEY is set)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
